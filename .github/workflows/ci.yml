name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  windows-fast:
    name: Windows fast
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: pwsh
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "store_path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Run fast verification
        run: dotnet run --project eng/Balls.Verify --configuration Release -- fast

  ubuntu-fast:
    name: Ubuntu fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Run fast verification
        run: dotnet run --project eng/Balls.Verify --configuration Release -- fast

  macos-fast:
    name: macOS fast
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Run fast verification
        run: dotnet run --project eng/Balls.Verify --configuration Release -- fast

  required:
    name: Required
    needs: [windows-fast, ubuntu-fast, macos-fast]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require successful platform lanes
        shell: bash
        env:
          WINDOWS_RESULT: ${{ needs.windows-fast.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu-fast.result }}
          MACOS_RESULT: ${{ needs.macos-fast.result }}
        run: |
          if [[ "$WINDOWS_RESULT" != "success" || "$UBUNTU_RESULT" != "success" || "$MACOS_RESULT" != "success" ]]; then
            echo "Required lane failure: Windows=$WINDOWS_RESULT Ubuntu=$UBUNTU_RESULT macOS=$MACOS_RESULT" >&2
            exit 1
          fi

          echo "Required Windows, Ubuntu, and macOS lanes passed."

  windows-canary:
    name: Windows Canary
    needs: required
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      needs.required.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out accepted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: pwsh
        run: corepack enable

      - name: Install browser dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and package Windows Canary once
        id: package
        shell: pwsh
        run: |
          $canaryRoot = Join-Path $env:RUNNER_TEMP 'balls-canary'
          $cliDirectory = Join-Path $canaryRoot 'input\balls'
          $daemonDirectory = Join-Path $canaryRoot 'input\ballsd'
          $outputDirectory = Join-Path $canaryRoot 'output'

          dotnet restore Balls.slnx --locked-mode
          dotnet restore src/Balls.Cli/Balls.Cli.csproj --runtime win-x64 -p:NuGetLockFilePath=obj/packages.win-x64.lock.json
          dotnet restore src/Balls.Daemon/Balls.Daemon.csproj --runtime win-x64 -p:NuGetLockFilePath=obj/packages.win-x64.lock.json
          dotnet publish src/Balls.Cli/Balls.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $cliDirectory
          dotnet publish src/Balls.Daemon/Balls.Daemon.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $daemonDirectory
          dotnet run --project eng/Balls.Canary --configuration Release --no-restore -- package `
            --repository-root . `
            --cli-directory $cliDirectory `
            --daemon-directory $daemonDirectory `
            --output-directory $outputDirectory `
            --platform windows `
            --architecture x64 `
            --commit '${{ github.sha }}'

          $archives = @(Get-ChildItem -LiteralPath $outputDirectory -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows Canary archive; found $($archives.Count)."
          }
          $archive = $archives[0]
          "artifact_name=$($archive.BaseName)" >> $env:GITHUB_OUTPUT

      - name: Smoke packaged Windows Canary
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'balls-canary\output'
          $archives = @(Get-ChildItem -LiteralPath $outputDirectory -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows Canary archive; found $($archives.Count)."
          }
          $archive = $archives[0]
          & .\eng\canary\Test-WindowsCanary.ps1 `
            -PackagePath $archive.FullName `
            -ChecksumPath ($archive.FullName + '.sha256') `
            -InstallerPath (Join-Path $outputDirectory 'Install-BallsCanary.ps1')

      - name: Upload Windows Canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/balls-canary/output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux-canary:
    name: Linux Canary
    needs: required
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      needs.required.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out accepted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: corepack enable

      - name: Install browser dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build and package Linux Canary once
        id: package
        shell: bash
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/balls-canary"
          cli_directory="$canary_root/input/balls"
          daemon_directory="$canary_root/input/ballsd"
          output_directory="$canary_root/output"

          dotnet restore Balls.slnx --locked-mode
          dotnet publish src/Balls.Cli/Balls.Cli.csproj --configuration Release --no-restore --output "$cli_directory"
          dotnet publish src/Balls.Daemon/Balls.Daemon.csproj --configuration Release --no-restore --output "$daemon_directory"
          dotnet run --project eng/Balls.Canary --configuration Release --no-restore -- package \
            --repository-root . \
            --cli-directory "$cli_directory" \
            --daemon-directory "$daemon_directory" \
            --output-directory "$output_directory" \
            --platform linux \
            --architecture x64 \
            --commit '${{ github.sha }}'

          archive="$(find "$output_directory" -maxdepth 1 -name '*.zip' -type f -print -quit)"
          unzip -p "$archive" canary.json | grep -F '"runtimeSupported": true'
          echo "artifact_name=$(basename "$archive" .zip)" >> "$GITHUB_OUTPUT"

      - name: Smoke packaged Linux Canary
        shell: bash
        run: |
          set -euo pipefail
          output_directory="$RUNNER_TEMP/balls-canary/output"
          archive="$(find "$output_directory" -maxdepth 1 -name '*.zip' -type f -print -quit)"
          bash ./eng/canary/Test-LinuxCanary.sh \
            "$archive" \
            "$archive.sha256" \
            "$output_directory/Install-BallsCanary.sh"

      - name: Upload Linux Canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/balls-canary/output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
